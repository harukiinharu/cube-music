<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ToneMatrix · Web 重构版</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="stage">
  <header class="head">
    <h1>ToneMatrix</h1>
    <p class="sub">原 Flash 版原理还原 · 16×16 五声音阶音序器</p>
  </header>

  <div class="canvas-wrap">
    <canvas id="matrix" width="512" height="512" aria-label="16 × 16 音符矩阵"></canvas>
    <div id="overlay" class="overlay">
      <div class="overlay-inner">
        <div class="overlay-mark"></div>
        <p class="overlay-title">点击开始</p>
        <p class="overlay-hint">浏览器需要一次交互才允许播放声音</p>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="btn-toggle" class="btn primary">暂停</button>
    <button id="btn-clear" class="btn">清空</button>

    <label class="field">
      <span>速度</span>
      <input id="tempo" type="range" min="40" max="240" step="1" value="120">
      <output id="tempo-out">120 BPM</output>
    </label>

    <label class="field">
      <span>音量</span>
      <input id="volume" type="range" min="0" max="100" step="1" value="85">
    </label>

    <label class="field check">
      <input id="playhead" type="checkbox" checked>
      <span>显示播放列</span>
    </label>
  </div>

  <footer class="foot">
    <p><strong>点击 / 拖动</strong> 开关方格　·　<strong>空格</strong> 清空</p>
    <p class="meta">音阶 D 大调五声（A–B–D–E–F#，A3 → A6）　·　16 步 / 小节　·　正弦 + 二次衰减包络 + 3 步反馈延迟</p>
  </footer>
</main>

<script src="src/constants.js"></script>
<script src="src/grid.js"></script>
<script src="src/audio.js"></script>
<script src="src/sequencer.js"></script>
<script src="src/renderer.js"></script>
<script src="src/app.js"></script>
</body>
</html>
