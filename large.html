<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cube Music · Large</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="wide">

<main class="stage stage-wide">
  <header class="head">
    <h1>Cube Music <span class="tag">Large</span></h1>
    <p class="sub">48 音 × 64 步　·　半音阶 A7 → A#3　·　方块与原版同尺寸，棋盘较大可滚动</p>
  </header>

  <!-- 棋盘（2048 × 1024）比屏幕大，所以套一个限宽限高的滚动框：
       整页不动，只有框里滚。框装得下时（屏幕够大）不出滚动条。 -->
  <div class="board-shell">
    <div class="board-frame">
      <div class="board-box">
        <!-- 播放位置标尺：宽度 = 棋盘宽度，跟着棋盘横向滚；纵向吸顶，滚下去也还在 -->
        <div class="ruler" id="ruler" role="slider" tabindex="0"
             aria-label="播放位置" aria-valuemin="0" aria-valuemax="63" aria-valuenow="0"
             title="点或拖动这里移动播放游标">
          <div class="ruler-fill" id="ruler-fill"></div>
          <div class="ruler-cursor" id="ruler-cursor"></div>
        </div>
        <div class="canvas-wrap">
          <canvas id="matrix" width="2048" height="1536" aria-label="48 × 64 音符矩阵"></canvas>
        </div>
      </div>
    </div>
    <!-- 遮罩放在滚动框**外面**，这样「点击开始」始终在可见区域中央，
         不会跟着棋盘一起被滚走 -->
    <div id="overlay" class="overlay">
      <div class="overlay-inner">
        <div class="overlay-mark"></div>
        <p class="overlay-title">点击启用声音</p>
        <p class="overlay-hint">之后按空格或点「播放」开始</p>
      </div>
    </div>
  </div>

  <div class="controls">
    <!-- 第一行：动作 + 显示开关（用竖线分组） -->
    <div class="ctl-row ctl-actions">
      <button id="btn-toggle" class="btn primary">播放</button>
      <button id="btn-clear" class="btn">清空</button>
      <span class="ctl-sep" aria-hidden="true"></span>
      <button id="btn-wave" class="btn toggle" aria-pressed="true">涟漪</button>
      <button id="btn-playhead" class="btn toggle" aria-pressed="true">播放列</button>
      <span class="ctl-sep" aria-hidden="true"></span>
      <button id="btn-share" class="btn" aria-expanded="false" aria-controls="share-row">谱子</button>
    </div>

    <!-- 第二行：参数。两行对齐成一列：标签 / 滑块 / 数值 -->
    <div class="ctl-row ctl-fields">
      <label class="f-label" for="tempo">速度</label>
      <input id="tempo" class="f-range" type="range" min="40" max="240" step="1" value="120">
      <output id="tempo-out" class="f-value" for="tempo">120 BPM</output>

      <label class="f-label" for="volume">音量</label>
      <input id="volume" class="f-range" type="range" min="0" max="100" step="1" value="85">
      <output id="volume-out" class="f-value" for="volume">85%</output>
    </div>

    <!-- 乐谱的导出 / 载入面板。默认收起，点「谱子」展开。 -->
    <div class="ctl-row ctl-share" id="share-row" hidden>
      <textarea id="share-code" class="share-code" rows="2" spellcheck="false"
                autocomplete="off" aria-label="乐谱代码"></textarea>
      <div class="share-acts">
        <button id="btn-share-copy" class="btn">复制</button>
        <button id="btn-share-load" class="btn">载入</button>
      </div>
      <p id="share-status" class="share-status" role="status"></p>
    </div>
  </div>

  <footer class="foot">
    <p><strong>点击 / 拖动</strong> 开关方格　·　<strong>右键</strong> 试听　·　<strong>空格</strong> 播放 / 暂停　·　<strong>⌘Z</strong> 撤销</p>
    <p class="meta"><strong>Alt + 拖动</strong> 框选　·　选中后：<strong>左键拖</strong> 搬走　·　<strong>A</strong> 填满　·　<strong>X</strong> 清空　·　<strong>Esc</strong> 取消</p>
    <p class="switch">改动会自动存在本机浏览器里　·　<a href="index.html">← 回到 16 × 16 原版</a></p>
  </footer>
</main>

<!--
  加载顺序与 index.html 一致，只在 constants 之后多插了一个 large-config：
  它在构造任何对象**之前**把 TM.RUNTIME 覆盖成 32 × 64，之后的模块一律从
  RUNTIME 读维度，因此不需要为大盘面单独维护一份引擎。
-->
<script src="src/constants.js"></script>
<script src="src/large-config.js"></script>
<script src="src/grid.js"></script>
<script src="src/audio.js"></script>
<script src="src/sequencer.js"></script>
<script src="src/renderer.js"></script>
<script src="src/storage.js"></script>
<script src="src/app.js"></script>
</body>
</html>
