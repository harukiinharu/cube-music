<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>large</title></head>
<body>
<canvas id="tcanvas" width="16" height="16"></canvas>
<pre id="out">running…</pre>
<iframe id="app" src="../large.html?debug=1" width="1100" height="1400" style="border:0"></iframe>
<script src="../src/constants.js"></script>
<script src="../src/large-config.js"></script>
<script src="../src/grid.js"></script>
<script src="../src/audio.js"></script>
<script src="../src/sequencer.js"></script>
<script src="../src/renderer.js"></script>
<script>
/*
 * Cube Music 大面板（32 行 × 64 列）自检
 *
 * 这一套专门盯「矩形网格」相对原版正方形网格多出来的失败模式：
 *   1. 一维数组拿 `size` 当 stride —— cols ≠ rows 时整片串位；
 *   2. 音序器 % GRID 提前归零 —— 后半段永远播不到；
 *   3. 命中测试写死 16 —— 右半边整片映射到错误列；
 *   4. 各种固定 16 的循环边界（行扫描、波场衰减统计、越界判断）。
 *
 * 本页同时加载 large-config.js，所以 TM.RUNTIME 就是大盘面配置。
 * 页面级部分用 iframe 加载真实的 large.html?debug=1，断言建立在模型状态上。
 */
(function () {
  var TM = window.TM, CFG = TM.CONFIG, R = TM.RUNTIME;
  var lines = [], pass = 0, fail = 0, done = false;

  function check(name, ok, detail) {
    (ok ? pass++ : fail++);
    lines.push((ok ? 'PASS  ' : 'FAIL  ') + name + (detail ? '   ' + detail : ''));
  }
  function info(name, detail) { lines.push('INFO  ' + name + '   ' + detail); }
  function near(a, b, tol) { return Math.abs(a - b) <= tol; }

  function report() {
    if (done) return;
    done = true;
    lines.unshift('Cube Music 大面板自检 —— ' + pass + ' 通过 / ' + fail + ' 失败');
    lines.unshift('');
    document.getElementById('out').textContent = lines.join('\n');
    document.title = 'DONE ' + pass + '/' + (pass + fail);
  }

  window.addEventListener('error', function (ev) {
    lines.push('JS ERROR: ' + ev.message + ' @line ' + ev.lineno);
    fail++; report();
  });
  window.addEventListener('unhandledrejection', function (ev) {
    lines.push('PROMISE REJECT: ' + (ev.reason && ev.reason.message || ev.reason));
    fail++; report();
  });
  setTimeout(function () {
    if (!done) {
      lines.push('WATCHDOG: 12s 内未完成');
      fail++; report();
    }
  }, 12000);

  // ── 1. 音表：以中音区为中心向上下延伸 ───────────────────
  // 与 src/large-config.js 保持同一条构造式：D 大调七声，行 0 = 原版最高音 + 7
  var notes = TM.buildScaleTable(32, CFG.NOTES[0] + 7, TM.SCALES.major);
  check('buildScaleTable(32) 长度 = 32', notes.length === 32, notes.length + '');
  check('行 0 是最高的音（E7 = 103）', notes[0] === 103, notes[0] + '');
  check('行 31 是最低的音（B2 = 50）', notes[31] === 50, notes[31] + '');

  var monotonic = true, intervals = {};
  for (var i = 1; i < notes.length; i++) {
    var d = notes[i - 1] - notes[i];
    if (d <= 0) monotonic = false;
    intervals[d] = (intervals[d] || 0) + 1;
  }
  check('音高严格递减', monotonic);
  // 七声音阶的相邻音程只有小二度(1)与大二度(2)
  check('相邻音程只出现 1 与 2（七声音阶）',
        intervals[1] > 0 && intervals[2] > 0 && Object.keys(intervals).length === 2,
        '出现音程 ' + Object.keys(intervals).sort().join('/'));

  // 每八度 7 个音 —— 这是「补上 4、7 音」的直接体现（原版五声是 5 个）
  var pitchClasses = {};
  notes.forEach(function (n) { pitchClasses[((n - 72) % 12 + 12) % 12] = 1; });
  check('每八度 7 个音级（D 大调七声）',
        Object.keys(pitchClasses).length === 7,
        '音级 ' + Object.keys(pitchClasses).map(Number).sort(function (a, b) {
          return a - b;
        }).join(','));
  // 补进来的正是第 4 音 G(10) 与第 7 音 C#(4)，原版五声里没有
  function hasClass(list, pc) {
    return list.some(function (n) { return ((n - 72) % 12 + 12) % 12 === pc; });
  }
  check('补上的第 4 音 G 与第 7 音 C# 都在新表里（原版五声里没有）',
        pitchClasses[10] === 1 && pitchClasses[4] === 1 &&
        !hasClass(CFG.NOTES, 10) && !hasClass(CFG.NOTES, 4),
        'G(10) / C#(4)');

  // 原版五声是七声的子集：每个原版音都能在新表里找到（行号不同，不能平移）
  var missing = CFG.NOTES.filter(function (n) { return notes.indexOf(n) < 0; });
  check('原版五声每个音都仍在七声表内（超集关系）',
        missing.length === 0, missing.length ? '缺 ' + missing.join(',') : '16 / 16 命中');

  var fLow = TM.noteToFrequency(notes[31]), fHigh = TM.noteToFrequency(notes[0]);
  check('音域落在可听范围内（20 Hz ~ 20 kHz）',
        fLow > 20 && fHigh < 20000,
        fLow.toFixed(1) + ' Hz ~ ' + fHigh.toFixed(1) + ' Hz');
  // 端点不是猜的：440 · 2^(31/12) = 2637.0 Hz（E7），440 · 2^(-22/12) = 123.47 Hz（B2）
  check('音域端点 = E7 (2637 Hz) → B2 (123.5 Hz)',
        near(fHigh, 2637.02, 0.5) && near(fLow, 123.47, 0.05),
        fHigh.toFixed(2) + ' Hz ~ ' + fLow.toFixed(2) + ' Hz');
  check('音域比原版宽（> 3 个八度）',
        Math.log(fHigh / fLow) / Math.LN2 > 3,
        (Math.log(fHigh / fLow) / Math.LN2).toFixed(2) + ' 个八度');

  // 生成器自校验：五声 + 原版最高音，必须逐位复现 CONFIG.NOTES
  var n16 = TM.buildScaleTable(16, CFG.NOTES[0], TM.SCALES.pentatonic);
  check('buildScaleTable 能逐位复现原版 NOTES',
        n16.join(',') === CFG.NOTES.join(','), n16.join(','));
  // 起手音不在音阶里必须报错，而不是悄悄产出错音表
  var threw = false;
  try { TM.buildScaleTable(8, CFG.NOTES[0] + 1, TM.SCALES.pentatonic); }
  catch (e) { threw = true; }
  check('起手音不在音阶内时抛错', threw);

  // 运行时确实被覆盖了，而 CONFIG 没被动过
  check('RUNTIME 已被 large-config 覆盖',
        R.cols === 64 && R.rows === 32 && R.cell === 32, R.cols + '×' + R.rows);
  check('CONFIG 保持原版（GRID/NOTES 未被改动）',
        CFG.GRID === 16 && CFG.NOTES.length === 16 && CFG.CELL === 32);

  // ── 2. 矩形网格：stride 与边界 ─────────────────────────
  var g = new TM.Grid();
  check('Grid 维度 = 64 × 32', g.cols === 64 && g.rows === 32,
        g.cols + '×' + g.rows);
  check('底层数组长度 = cols × rows', g.cells.length === 2048, g.cells.length + '');
  check('索引 = 列 × 行数 + 行', g.index(63, 31) === 63 * 32 + 31,
        'index(63,31) = ' + g.index(63, 31));

  // 拿 size 当 stride 就会在这里翻车：(1,0) 与 (0,1) 会落到同一个下标
  var g1 = new TM.Grid();
  g1.set(1, 0, true);
  check('矩形下 (1,0) 不串到 (0,1)',
        g1.get(1, 0) === true && g1.get(0, 1) === false && g1.count() === 1,
        'count = ' + g1.count());

  // stride 写成 cols（而不是 rows）时，右下角会落到数组之外被静默丢弃。
  // 这两条把「列主序映射是双射且铺满」钉死，任何 stride 混淆都跑不掉。
  var gs = new TM.Grid();
  var seen = {}, unique = true;
  for (var sc = 0; sc < 64; sc++) {
    for (var sr = 0; sr < 32; sr++) {
      var idx = gs.index(sc, sr);
      if (seen[idx]) unique = false;
      seen[idx] = 1;
    }
  }
  check('每个格子的下标唯一（列主序是双射）',
        unique && Object.keys(seen).length === 2048,
        Object.keys(seen).length + ' 个不同下标');

  var gAll = new TM.Grid();
  for (var ac = 0; ac < 64; ac++) for (var ar = 0; ar < 32; ar++) gAll.set(ac, ar, true);
  check('铺满 64 × 32 全部可写（stride 未越界）',
        gAll.count() === 2048 && gAll.get(63, 31) && gAll.get(0, 0),
        'count = ' + gAll.count());

  var g2 = new TM.Grid();
  g2.set(63, 31, true);
  check('右下角可读可写', g2.get(63, 31) === true && g2.count() === 1);
  g2.set(64, 0, true);
  g2.set(0, 32, true);
  g2.set(-1, 0, true);
  check('越界写入被拒绝', g2.count() === 1, 'count = ' + g2.count());

  var g3 = new TM.Grid();
  g3.paintLine({ col: 0, row: 0 }, { col: 63, row: 0 }, true);
  check('跨 64 列拖动补齐 63 格（起点不动）',
        g3.count() === 63 && g3.get(63, 0) && !g3.get(0, 0),
        'count = ' + g3.count());

  var g4 = new TM.Grid();
  g4.paintLine({ col: 0, row: 0 }, { col: 0, row: 31 }, true);
  check('跨 32 行拖动补齐 31 格', g4.count() === 31 && g4.get(0, 31),
        'count = ' + g4.count());

  // ── 3. 音序器：绕回按列数，行扫描按行数 ─────────────────
  function fakeAudio() {
    return {
      ready: true,
      ctx: { currentTime: 0 },
      tempo: 120,
      played: [],
      synthNote: function (note) { this.played.push(note); },
      setTempo: function (b) { this.tempo = b; },
      outputLatency: function () { return 0; }
    };
  }

  var fa = fakeAudio();
  var sg = new TM.Grid();
  var seq = new TM.Sequencer(fa, sg, R);
  check('音序器取到 32 音的音表',
        seq.notes.length === 32 && seq.notes === R.notes, seq.notes.length + ' 个音');

  // 从第 60 步起步并让 nextStepTime 落在过去，一次 _tick 会连排若干步。
  // 若绕回仍写死 % 16，第 61 步会变成 13（61 % 16），序列立刻断掉。
  seq.playing = true;
  seq.currentStep = 60;
  seq.nextStepTime = -0.5;                       // 120 BPM 步长 0.125 → 排 5 步
  seq._tick();
  var steps = seq.timeline.map(function (t) { return t.step; });
  check('步号跨过 64 才绕回（不是 16）',
        steps.length === 5 &&
        steps[0] === 60 && steps[1] === 61 && steps[2] === 62 &&
        steps[3] === 63 && steps[4] === 0,
        steps.join(','));
  // currentStep 指向「下一个待排的步」：排完第 0 步后它应前进到 1
  check('绕回后 currentStep 前进到 1（而非 0 以外的地方）',
        seq.currentStep === 1, seq.currentStep + '');

  // 行扫描必须覆盖全部 32 行：第 20 行与第 31 行都超出原版的 16 行循环
  var fa2 = fakeAudio();
  var sg2 = new TM.Grid();
  var seq2 = new TM.Sequencer(fa2, sg2, R);
  sequencerTestRows(sg2, seq2);

  function sequencerTestRows(grid, s) {
    grid.set(7, 20, true);                       // 行 20 → notes[20] = 69
    grid.set(7, 31, true);                       // 行 31 → notes[31] = 50
    grid.set(7, 3, true);                        // 行 3  → notes[3] = 98
    s._scheduleStep(7, 0);
  }
  var played = fa2.played.slice().sort(function (a, b) { return a - b; });
  check('排程扫描全部 32 行（含原版循环之外的行）',
        played.length === 3 && played[0] === 50 && played[1] === 69 && played[2] === 98,
        played.join(','));
  check('音高取自 RUNTIME 音表而非 CONFIG.NOTES',
        played[2] === R.notes[3] && R.notes[3] !== CFG.NOTES[3],
        'notes[3] = ' + R.notes[3] + '，原版 notes[3] = ' + CFG.NOTES[3]);

  // 时间轴反查在 64 步下仍然正确
  check('stepAtTime 反查 64 步时间轴',
        seq.stepAtTime(-0.5) === 60 && seq.stepAtTime(-0.4) === 60 &&
        seq.stepAtTime(-0.375) === 61 && seq.stepAtTime(0) === 0,
        [seq.stepAtTime(-0.5), seq.stepAtTime(-0.375), seq.stepAtTime(0)].join(','));

  // ── 4. 渲染器：矩形尺寸与局部重绘 ──────────────────────
  var canvas = document.getElementById('tcanvas');
  var rg = new TM.Grid();
  var r = new TM.Renderer(canvas, rg, R);

  check('逻辑尺寸 = cols × cell / rows × cell',
        r.w === 2048 && r.h === 1024, r.w + '×' + r.h);
  check('画布尺寸 = 逻辑尺寸 × dpr',
        canvas.width === r.devW && canvas.height === r.devH,
        canvas.width + '×' + canvas.height + ' (dpr ' + r.scale + ')');
  check('devSize 仍等于 devW（兼容旧探针）', r.devSize === r.devW);

  // 本轮的诉求就是这条：大盘面的方块必须与原版**逐像素同尺寸**。
  // 比的是设备像素下的方块边长，而不是配置项名字。
  function blockPx(rr) { return (rr.cell - 2 * rr.inset) * rr.scale; }
  var rOrig16 = new TM.Renderer(canvas, new TM.Grid({ cols: 16, rows: 16 }), {});
  check('方块与原版同尺寸（cell / inset / radius 全部沿用原版）',
        r.cell === rOrig16.cell && r.inset === rOrig16.inset && r.radius === rOrig16.radius &&
        r.cell === CFG.CELL && r.inset === CFG.CELL_INSET && r.radius === CFG.CELL_RADIUS,
        '大盘面 ' + r.cell + '/' + r.inset + '/' + r.radius +
        '　原版 ' + rOrig16.cell + '/' + rOrig16.inset + '/' + rOrig16.radius);
  check('方块设备像素边长与原版相等（26 × dpr）',
        blockPx(r) === blockPx(rOrig16) && blockPx(r) === 26 * r.scale,
        blockPx(r) + ' px vs 原版 ' + blockPx(rOrig16) + ' px');
  // inset 取非整数（例如按比例算出的 1.5）会让方块边界在半像素上被抗锯齿糊出灰边。
  check('内缩为整数（任意 dpr 下才能像素对齐）',
        r.inset === Math.round(r.inset) && r.inset > 0 && r.inset < r.cell / 2,
        'inset = ' + r.inset);

  check('波场是 32 行 × 64 列（不是 16×16）',
        r.mapA.length === 32 && r.mapA[0].length === 64 &&
        r.mapB.length === 32 && r.mapB[0].length === 64,
        r.mapA.length + '×' + r.mapA[0].length);
  // 波纹层比画布小是**故意的**（它要模糊，按画布分辨率渲染是浪费面积），
  // 但宽高比必须与网格一致，否则放大后会拉伸。数值来自 large-config 的调参，
  // 改那里的话这里要同步。
  check('波纹图层与网格同宽高比（放大不拉伸）',
        r.waveH * r.cols === r.waveW * r.rows,
        r.waveW + '×' + r.waveH + '  vs 网格 ' + r.cols + '×' + r.rows);
  check('波纹图层低于画布分辨率（省掉无谓面积）',
        r.waveW === 1024 && r.waveH === 512 && r.waveW < r.w,
        r.waveW + '×' + r.waveH + ' < ' + r.w + '×' + r.h);
  check('波纹图层的采样画布 = cols × rows',
        r.waveSmall.width === 64 && r.waveSmall.height === 32,
        r.waveSmall.width + '×' + r.waveSmall.height);

  function snapshot(rr) {
    return rr.patternLayer.getContext('2d').getImageData(0, 0, rr.devW, rr.devH).data;
  }
  function samePixels(a, b) {
    if (a.length !== b.length) return false;
    for (var k = 0; k < a.length; k++) if (a[k] !== b[k]) return false;
    return true;
  }

  rg.set(40, 20, true);
  rg.set(3, 31, true);
  var pxFull = snapshot(r);
  r.drawPattern();
  check('矩形下整层重绘可重现（确定性）', samePixels(pxFull, snapshot(r)));

  rg.set(63, 0, true);                          // 走局部重绘（drawCell）
  var pxIncr = snapshot(r);
  r.drawPattern();
  check('矩形下局部重绘 == 整层重绘（开格）', samePixels(pxIncr, snapshot(r)));

  rg.set(40, 20, false);
  var pxOff = snapshot(r);
  r.drawPattern();
  check('矩形下局部重绘 == 整层重绘（关格）', samePixels(pxOff, snapshot(r)));

  // flash 的越界判断必须分别看 cols 与 rows
  var rf = new TM.Renderer(canvas, new TM.Grid(), R);
  check('flash 在矩形内的合法格返回 true',
        rf.flash(63, 31) === true && rf.flash(16, 20) === true);
  check('flash 越界返回 false（列/行分别判定）',
        rf.flash(64, 0) === false && rf.flash(0, 32) === false &&
        rf.flash(16, 40) === false);
  rf.highlights.length = 0;
  check('flash 不改动图案', rf.grid.count() === 0);

  // ── 5. 波场：种子落在 [行][列]，传播与衰减 ─────────────
  var wg = new TM.Grid();
  var wr = new TM.Renderer(canvas, wg, R);
  wg.set(40, 5, true);
  check('种子注入 mapB[行][列] = -1', wr.mapB[5][40] === -1,
        'mapB[5][40] = ' + wr.mapB[5][40]);

  wr.stepDiffusion(39);                         // next = 40 → 给第 40 列播种
  check('种子格扩散后为正', near(wr.mapA[5][40], 0.85, 1e-9),
        'mapA[5][40] = ' + wr.mapA[5][40].toFixed(4));

  wr.stepDiffusion(40);
  check('波前传到相邻列', wr.mapA[5][41] > 0,
        'mapA[5][41] = ' + wr.mapA[5][41].toFixed(4));

  for (var w = 0; w < 120; w++) wr.stepDiffusion(63);   // 无输入 → 应衰减
  var maxAbs = 0;
  for (var wy = 0; wy < 32; wy++) {
    for (var wx = 0; wx < 64; wx++) maxAbs = Math.max(maxAbs, Math.abs(wr.mapA[wy][wx]));
  }
  check('无输入时矩形波场衰减', maxAbs < 0.01, 'max|mapA| = ' + maxAbs.toFixed(6));

  // 满列播放在 32 行下仍然有界（对应原版那条「暂停必须停止注入」的前置结论）
  var bg = new TM.Grid();
  var br = new TM.Renderer(canvas, bg, R);
  for (var bc = 0; bc < 32; bc++) bg.set(10, bc, true);
  for (var bf = 0; bf < 12; bf++) br.stepDiffusion(9, true);   // next = 10
  var peak = 0;
  for (var by = 0; by < 32; by++) {
    for (var bx = 0; bx < 64; bx++) peak = Math.max(peak, Math.abs(br.mapA[by][bx]));
  }
  check('满列播放时波场有界', peak > 0.01 && peak < 100, 'peak = ' + peak.toFixed(3));

  // 关闭涟漪要清空整张 32 × 64 的场，不能只清 16 × 16
  br.setWaveEnabled(false);
  var zeroed = true;
  for (var zy = 0; zy < 32; zy++) {
    for (var zx = 0; zx < 64; zx++) {
      if (br.mapA[zy][zx] !== 0 || br.mapB[zy][zx] !== 0) zeroed = false;
    }
  }
  check('关闭涟漪清空整张矩形波场', zeroed);

  // 播放列高亮宽度应等于格子宽度
  var cg = new TM.Grid();
  var cr = new TM.Renderer(canvas, cg, R);
  cr.showWave = false;
  cr.composite(59);                             // 高亮第 59 列（原版只有 0..15）
  var cctx = cr.ctx;
  function lumAtLogical(x, y) {
    var d = cctx.getImageData(Math.round(x * cr.scale), Math.round(y * cr.scale), 1, 1).data;
    return d[0];
  }
  var inCol = lumAtLogical(59 * 32 + 16, 200);   // 第 59 列内
  var outCol = lumAtLogical(60 * 32 + 16, 200);  // 第 60 列内
  check('播放列高亮落在第 59 列', inCol > outCol + 5,
        '第59列 ' + inCol + ' vs 第60列 ' + outCol);

  // ── 6. 页面级：真实 large.html ─────────────────────────
  var frame = document.getElementById('app');

  function wait(ms) { return new Promise(function (res) { setTimeout(res, ms); }); }
  async function waitFor(fn, limit, label) {
    var waited = 0;
    while (waited < limit) {
      try { if (fn()) return true; } catch (e) { /* 忽略 */ }
      await wait(40); waited += 40;
    }
    if (label) info('轮询超时', label);
    return false;
  }

  function runPage() {
    return new Promise(function (resolve) {
      var settled = false;
      function go() {
        if (settled) return;
        settled = true;
        resolve();
      }
      frame.addEventListener('load', function () {
        checkPage(frame, check, info, waitFor).then(go, function (e) {
          check('页面级自检未抛异常', false, String(e && e.message || e));
          go();
        });
      });
      setTimeout(go, 9000);                     // iframe 没加载也要收尾
    });
  }

  async function checkPage(frameEl, check, info, waitFor) {
    var win = frameEl.contentWindow, doc = frameEl.contentDocument;
    if (!doc) { check('能访问 iframe 文档', false, 'contentDocument 为空'); return; }
    win.addEventListener('error', function (e) {
      check('large.html 内无未捕获错误', false, e.message + ' @' + e.lineno);
    });
    // large-config.js 真的生效了：RUNTIME 被换成了另一张音表，
    // 而 CONFIG 那份原版音表原封不动
    check('页面 RUNTIME 是独立于 CONFIG.NOTES 的新音表',
          win.TM.RUNTIME.notes !== win.TM.CONFIG.NOTES &&
          win.TM.RUNTIME.notes.length === 32 &&
          win.TM.CONFIG.NOTES.length === 16 &&
          win.TM.RUNTIME.cols === 64 && win.TM.RUNTIME.cell === win.TM.CONFIG.CELL);

    var ready = await waitFor(function () { return !!win.__cubeMusicDebug; }, 3000,
                              '等待 large.html 启动');
    check('large.html 带 ?debug=1 暴露句柄', ready);
    if (!ready) return;

    var dbg = win.__cubeMusicDebug;
    check('页面网格 = 64 列 × 32 行',
          dbg.grid.cols === 64 && dbg.grid.rows === 32,
          dbg.grid.cols + '×' + dbg.grid.rows);
    check('页面音序器音表 32 个音',
          dbg.sequencer.notes.length === 32, dbg.sequencer.notes.length + '');
    var pageNotes = dbg.sequencer.notes;
    check('页面音表是七声（每八度 7 个音级）', (function () {
      var set = {};
      pageNotes.forEach(function (n) { set[((n - 72) % 12 + 12) % 12] = 1; });
      return Object.keys(set).length === 7;
    })(), pageNotes.slice(0, 7).join(','));
    check('页面音表覆盖原版五声的全部音',
          win.TM.CONFIG.NOTES.every(function (n) { return pageNotes.indexOf(n) >= 0; }));

    var canvas = doc.getElementById('matrix');
    check('画布设备尺寸 = 2048 × 1024 × dpr',
          canvas.width === 2048 * dbg.renderer.scale &&
          canvas.height === 1024 * dbg.renderer.scale,
          canvas.width + '×' + canvas.height);
    check('页面标题为 Large 版', /Large/.test(doc.title), doc.title);

    var wrap = doc.querySelector('.canvas-wrap');
    check('棋盘宽高由 --board-w / --board-h 给出',
          win.getComputedStyle(wrap).width.indexOf('2048') === 0,
          win.getComputedStyle(wrap).width);

    // 这一条是「方块与原版一样大」在上屏环节的保证：CSS 尺寸必须等于逻辑尺寸，
    // 否则浏览器会二次重采样，方块看着就变小/变糊了。
    var rect = canvas.getBoundingClientRect();
    check('画布 1:1 上屏（CSS 尺寸 = 逻辑尺寸，未缩放）',
          Math.abs(rect.width - 2048) < 1.5 && Math.abs(rect.height - 1024) < 1.5,
          Math.round(rect.width) + '×' + Math.round(rect.height));

    // ── 滚动被收进框里，而不是整页滚 ─────────────────────
    var frameEl = doc.querySelector('.board-frame');
    check('棋盘套在 .board-frame 滚动框内',
          !!frameEl && frameEl.contains(wrap));
    check('滚动框 overflow: auto（装得下就不出滚动条）',
          win.getComputedStyle(frameEl).overflow === 'auto',
          win.getComputedStyle(frameEl).overflow);
    check('整页自身不滚动（滚动收在框内）',
          win.getComputedStyle(doc.body).overflow === 'hidden',
          'body.overflow = ' + win.getComputedStyle(doc.body).overflow);
    check('滚动框宽度不超过棋盘（屏幕够大就不出横向滚动条）',
          frameEl.getBoundingClientRect().width <= 2049,
          Math.round(frameEl.getBoundingClientRect().width) + ' ≤ 2048');
    // 本 iframe 只有 1100px 宽，比棋盘窄 —— 正好验证「小屏时框内确实能滚」
    check('框比棋盘窄时确实可滚（本 iframe 1100px）',
          frameEl.scrollWidth > frameEl.clientWidth + 1,
          frameEl.scrollWidth + ' > ' + frameEl.clientWidth);
    check('遮罩在滚动框之外（「点击开始」不会随棋盘滚走）',
          !frameEl.contains(doc.getElementById('overlay')) &&
          !!doc.querySelector('.board-shell .overlay'));

    // 命中测试：点最右一列、最下一行 —— 写死 16 的话这里必然错位
    function tapCell(col, row, pointerId) {
      var p = {
        clientX: rect.left + rect.width * ((col + 0.5) / 64),
        clientY: rect.top + rect.height * ((row + 0.5) / 32)
      };
      canvas.dispatchEvent(new win.PointerEvent('pointerdown', {
        clientX: p.clientX, clientY: p.clientY,
        bubbles: true, cancelable: true, pointerId: pointerId, isPrimary: true
      }));
    }

    check('初始网格为空', dbg.grid.count() === 0, 'count = ' + dbg.grid.count());
    tapCell(63, 31, 1);
    var lit = await waitFor(function () { return dbg.grid.get(63, 31) === true; }, 1500);
    check('点右下角点亮 cell(63,31)', lit, 'count = ' + dbg.grid.count());
    check('只点亮一格（未串位）', dbg.grid.count() === 1,
          'count = ' + dbg.grid.count());

    tapCell(0, 0, 2);
    var lit2 = await waitFor(function () { return dbg.grid.get(0, 0) === true; }, 1500);
    check('点左上角点亮 cell(0,0)', lit2);
    check('两格互不影响', dbg.grid.get(63, 31) === true && dbg.grid.count() === 2,
          'count = ' + dbg.grid.count());

    // 播放一帧，确认渲染链路在 1024 × 512 上真的跑得动
    dbg.renderer.composite(63);
    var px = canvas.getContext('2d')
      .getImageData(Math.round((63 * 32 + 16) * dbg.renderer.scale),
                    Math.round((31 * 32 + 16) * dbg.renderer.scale), 1, 1).data[0];
    check('合成后右下角确实是亮格', px > 200, '亮度 ' + px);
  }

  runPage().then(report, function (e) {
    check('页面级自检未抛异常', false, String(e && e.message || e));
    report();
  });
})();
</script>
</body>
</html>
