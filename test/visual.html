<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>render check</title>
<style>
  html,body{margin:0;background:#000;}
  canvas{display:block;width:512px;height:512px;}
  pre{color:#666;font:11px monospace;margin:8px;}
</style>
</head>
<body>
<canvas id="matrix" width="512" height="512"></canvas>
<pre id="log"></pre>
<script src="../src/constants.js"></script>
<script src="../src/grid.js"></script>
<script src="../src/renderer.js"></script>
<script>
var TM = window.TM, CFG = TM.CONFIG;
var grid = new TM.Grid();

// 铺一个「旋律 + 低音脉冲」的图案
var preset = [
  // 低音脉冲（底部四行，每 4 步一次）
  [0, 15], [4, 15], [8, 15], [12, 15],
  [0, 11], [6, 11], [10, 11],
  // 中音琶音
  [2, 7], [4, 5], [6, 7], [8, 5], [10, 7], [12, 5],
  // 高音点缀
  [1, 2], [5, 1], [9, 3], [13, 2], [15, 4]
];
preset.forEach(function (p) { grid.set(p[0], p[1], true); });

var canvas = document.getElementById('matrix');
var rnd = new TM.Renderer(canvas, grid);

// 按真实节奏预热：120 BPM / 16 步 → 每步 125ms ≈ 8 帧 @60fps
var FRAMES_PER_STEP = 8;
var step = 6;
for (var i = 0; i < 260; i++) {
  rnd.stepDiffusion(Math.floor(i / FRAMES_PER_STEP) % 16);
}
rnd.render(step);

// 统计一下画面，作为客观指标
(function () {
  var ctx = canvas.getContext('2d');
  var d = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
  var sum = 0, max = 0, nonBlack = 0;
  for (var i2 = 0; i2 < d.length; i2 += 4) {
    var v = d[i2];
    sum += v;
    if (v > max) max = v;
    if (v > 12) nonBlack++;
  }
  document.getElementById('log').textContent =
    'mean=' + (sum / (d.length / 4)).toFixed(2) +
    '  max=' + max +
    '  nonBlackRatio=' + (nonBlack / (d.length / 4) * 100).toFixed(1) + '%' +
    '  activeCells=' + grid.count();

  // 16×16 亮度采样（格子中心）
  var rows = [], W = canvas.width / 16, H = canvas.height / 16;
  for (var gy = 0; gy < 16; gy++) {
    var line = '';
    for (var gx = 0; gx < 16; gx++) {
      var px = Math.floor(gx * W + W / 2);
      var py = Math.floor(gy * H + H / 2);
      var idx = (py * canvas.width + px) * 4;
      var lum = d[idx];
      line += String.fromCharCode(48 + Math.min(9, Math.round(lum / 26)));
    }
    rows.push(line);
  }
  var pre = document.createElement('pre');
  pre.id = 'lum';
  pre.textContent = '最终画布 16×16 亮度采样（格子中心）:\n' + rows.join('\n');
  document.body.appendChild(pre);
  document.title = 'DONE';
})();
</script>
</body>
</html>
