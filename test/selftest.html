<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Cube Music 自检</title>
</head>
<body>
<canvas id="tcanvas" width="16" height="16"></canvas>
<pre id="results">running…</pre>
<script src="../src/constants.js"></script>
<script src="../src/grid.js"></script>
<script src="../src/audio.js"></script>
<script src="../src/sequencer.js"></script>
<script src="../src/renderer.js"></script>
<script>
(function () {
  var TM = window.TM, CFG = TM.CONFIG;
  var lines = [], pass = 0, fail = 0;

  function check(name, ok, detail) {
    (ok ? pass++ : fail++);
    lines.push((ok ? 'PASS  ' : 'FAIL  ') + name + (detail ? '   ' + detail : ''));
  }
  function near(a, b, tol) { return Math.abs(a - b) <= tol; }

  // 出错或超时也要把结果落到 DOM，否则无头抓取只能看到 "running…"
  var done = false;
  function report() {
    if (done) return;
    done = true;
    lines.unshift('Cube Music 自检 —— ' + pass + ' 通过 / ' + fail + ' 失败');
    lines.unshift('');
    document.getElementById('results').textContent = lines.join('\n');
    document.title = 'DONE ' + pass + '/' + (pass + fail);
  }
  window.addEventListener('error', function (ev) {
    lines.push('JS ERROR: ' + ev.message + ' @line ' + ev.lineno);
    fail++;
    report();
  });
  window.addEventListener('unhandledrejection', function (ev) {
    lines.push('PROMISE REJECT: ' + (ev.reason && ev.reason.message || ev.reason));
    fail++;
    report();
  });
  setTimeout(function () {
    if (!done) {
      lines.push('WATCHDOG: 8s 内未完成，可能卡在异步渲染');
      fail++;
      report();
    }
  }, 8000);

  // ── 1. 音高换算 ────────────────────────────────────────
  check('noteToFrequency(72) = 440 Hz', near(TM.noteToFrequency(72), 440, 1e-9),
        TM.noteToFrequency(72).toFixed(4));
  check('noteToFrequency(60) = 220 Hz', near(TM.noteToFrequency(60), 220, 1e-9),
        TM.noteToFrequency(60).toFixed(4));
  check('noteToFrequency(96) = 1760 Hz', near(TM.noteToFrequency(96), 1760, 1e-9),
        TM.noteToFrequency(96).toFixed(4));
  check('NOTES 表长度与内容', CFG.NOTES.length === 16 &&
        CFG.NOTES[0] === 96 && CFG.NOTES[15] === 60, CFG.NOTES.join(','));

  // ── 2. 时序 ────────────────────────────────────────────
  check('barSeconds(120) = 2 s', near(TM.barSeconds(120), 2, 1e-12),
        TM.barSeconds(120) + ' s');
  check('stepSeconds(120) = 0.125 s', near(TM.stepSeconds(120), 0.125, 1e-12),
        TM.stepSeconds(120) + ' s');
  check('RESOLUTION = 16', CFG.RESOLUTION === 16);

  // ── 3. 包络曲线 ────────────────────────────────────────
  var curve = TM.buildEnvelopeCurve(96);
  check('包络首值 = 0.4² = 0.16', near(curve[0], 0.16, 1e-6), curve[0].toFixed(8));
  check('包络末值 = 0', curve[curve.length - 1] === 0);
  var monotonic = true;
  for (var i = 1; i < curve.length; i++) if (curve[i] > curve[i - 1]) monotonic = false;
  check('包络单调递减（二次衰减）', monotonic);
  check('包络中点 ≈ 0.16·0.25', near(curve[48], 0.16 * 0.25, 1e-3),
        curve[48].toFixed(6));

  // ── 4. 网格 ────────────────────────────────────────────
  var g = new TM.Grid();
  check('初始为空', g.count() === 0);
  check('steps[列][行] 索引正确', (function () {
    g.set(3, 5, true);
    return g.get(3, 5) === true && g.get(5, 3) === false;
  })(), 'set(3,5) → get(5,3) 应为 false');
  check('toggle 返回值', g.toggle(3, 5) === false && g.get(3, 5) === false);
  g.clear();
  check('clear 生效', g.count() === 0);

  // ── 4.5 拖动涂抹补齐（paintLine）───────────────────────
  // 契约：涂 (from, to] —— 含终点、不含起点（起点那格已经在上一轮画过了）
  var gl = new TM.Grid();
  gl.paintLine({ col: 0, row: 0 }, { col: 3, row: 0 }, true);
  check('水平拖动补齐 (from,to]，起点不动',
        gl.get(1, 0) && gl.get(2, 0) && gl.get(3, 0) && !gl.get(0, 0) &&
        gl.count() === 3, 'count = ' + gl.count());

  var gl2 = new TM.Grid();
  gl2.paintLine({ col: 0, row: 0 }, { col: 3, row: 3 }, true);
  check('对角拖动补齐，无断点',
        gl2.get(1, 1) && gl2.get(2, 2) && gl2.get(3, 3) && gl2.count() === 3,
        'count = ' + gl2.count());

  var gl3 = new TM.Grid();
  gl3.set(2, 2, true);
  gl3.paintLine({ col: 2, row: 2 }, { col: 2, row: 2 }, true);
  check('原地拖动不重复计数', gl3.count() === 1, 'count = ' + gl3.count());

  var gl4 = new TM.Grid();
  gl4.paintLine(null, { col: 5, row: 6 }, true);
  check('无起点时只涂终点一格', gl4.get(5, 6) && gl4.count() === 1);

  var gl5 = new TM.Grid();
  gl5.paintLine({ col: 15, row: 15 }, { col: 15, row: 0 }, true);
  check('垂直拖动补齐 15 步', gl5.count() === 15 && gl5.get(15, 0),
        'count = ' + gl5.count());

  // ── 4.6 局部重绘必须与整层重绘等价 ─────────────────────
  function snapshot(r) {
    var D = r.devSize;
    return r.patternLayer.getContext('2d').getImageData(0, 0, D, D).data;
  }
  function samePixels(a, b) {
    if (a.length !== b.length) return false;
    for (var i2 = 0; i2 < a.length; i2++) if (a[i2] !== b[i2]) return false;
    return true;
  }
  var gp = new TM.Grid();
  var rp = new TM.Renderer(document.getElementById('tcanvas'), gp);
  gp.set(2, 3, true);
  gp.set(5, 9, true);
  var pxFull = snapshot(rp);
  rp.drawPattern();                       // 同一状态整层重绘
  check('整层重绘可重现（确定性）', samePixels(pxFull, snapshot(rp)));

  gp.set(7, 1, true);                     // 走 drawCell 局部重绘路径
  var pxIncr = snapshot(rp);
  rp.drawPattern();
  check('开启格子后：局部重绘 == 整层重绘', samePixels(pxIncr, snapshot(rp)));

  gp.set(2, 3, false);                    // 关格子同样走局部重绘
  var pxOff = snapshot(rp);
  rp.drawPattern();
  check('关闭格子后：局部重绘 == 整层重绘', samePixels(pxOff, snapshot(rp)));
  check('局部重绘确实省掉了整层重绘',
        CFG.BLUR_CELL === 0, 'BLUR_CELL = ' + CFG.BLUR_CELL +
        '（>0 时会回退到整层重绘）');

  // ── 5. 扩散场 ──────────────────────────────────────────
  var grid2 = new TM.Grid();
  var rnd = new TM.Renderer(document.getElementById('tcanvas'), grid2);
  grid2.set(4, 7, true);
  check('setStep 注入种子 -1（mapB[行][列]）', rnd.mapB[7][4] === -1,
        'mapB[7][4] = ' + rnd.mapB[7][4]);
  grid2.set(4, 7, false);
  check('关闭格子同样注入种子', rnd.mapB[7][4] === -1);

  rnd.stepDiffusion(4);
  var seed = rnd.mapA[7][4];
  check('种子格扩散后为正', near(seed, 0.85, 1e-9), 'mapA[7][4] = ' + seed.toFixed(4));

  // 波动方程是二阶的：扰动需要第二步才传到相邻格
  rnd.stepDiffusion(5);
  var neighbour = rnd.mapA[7][5];
  check('邻格被带动（波前传播）', neighbour > 0, 'mapA[7][5] = ' + neighbour.toFixed(4));

  // 无种子时应衰减到 0
  for (var k = 0; k < 80; k++) rnd.stepDiffusion(15);
  var maxAbs = 0;
  for (var a = 0; a < 16; a++) for (var b = 0; b < 16; b++)
    maxAbs = Math.max(maxAbs, Math.abs(rnd.mapA[a][b]));
  check('无输入时扩散场衰减', maxAbs < 0.01, 'max|mapA| = ' + maxAbs.toFixed(6));

  // ── 5.2 涟漪开关 ───────────────────────────────────────
  function maxLum(r) {
    var D = r.devSize;
    var d = r.ctx.getImageData(0, 0, D, D).data;
    var m = 0;
    for (var i = 0; i < d.length; i += 4) if (d[i] > m) m = d[i];
    return m;
  }

  var gw = new TM.Grid();
  var rw = new TM.Renderer(document.getElementById('tcanvas'), gw);
  rw.showPlayhead = false;
  gw.set(3, 3, true);                       // 同时经 applyChange 注入种子
  for (var wi = 0; wi < 30; wi++) rw.stepDiffusion(2);   // next=3，持续泵这一列

  var fieldMax = 0;
  for (var fy = 0; fy < 16; fy++) {
    for (var fx = 0; fx < 16; fx++) fieldMax = Math.max(fieldMax, Math.abs(rw.mapA[fy][fx]));
  }
  check('涟漪开启时波场有能量', fieldMax > 0.1, 'max|mapA| = ' + fieldMax.toFixed(3));

  rw.composite(2);
  var lumOn = maxLum(rw);
  check('开启涟漪时辉光把像素推过 #EEEEEE(238)', lumOn > 240, 'max = ' + lumOn);

  rw.setWaveEnabled(false);
  check('关闭后 showWave = false', rw.showWave === false);

  var zeroed = true;
  for (var zy = 0; zy < 16; zy++) {
    for (var zx = 0; zx < 16; zx++) {
      if (rw.mapA[zy][zx] !== 0 || rw.mapB[zy][zx] !== 0) zeroed = false;
    }
  }
  check('关闭涟漪会清空波场（避免重新打开冒出冻结的旧涟漪）', zeroed);

  gw.set(5, 5, true);
  check('关闭后点格子不再注入种子', rw.mapB[5][5] === 0, 'mapB[5][5] = ' + rw.mapB[5][5]);

  rw.composite(2);
  var lumOff = maxLum(rw);
  check('关闭涟漪后画面最亮不超过 #EEEEEE(238)', lumOff <= 238, 'max = ' + lumOff);

  // ── 5.3 暂停时涟漪必须衰减，不能持续被泵高 ─────────────
  // 背景：暂停时步号冻结，若继续向「下一步那一列」注入种子，
  // 等于对同一列无限次重复激励，波场会指数爆炸（实测 3000 帧达 1e283），
  // 叠加 ADD 辉光后铺满整屏。所以暂停时必须传 seed = false。
  function absMaxField(m) {
    var x = 0;
    for (var i = 0; i < 16; i++) {
      for (var j = 0; j < 16; j++) x = Math.max(x, Math.abs(m[i][j]));
    }
    return x;
  }

  var gz = new TM.Grid();
  var rz = new TM.Renderer(document.getElementById('tcanvas'), gz);
  for (var zc = 0; zc < 16; zc++) gz.set(5, zc, true);      // 满列

  for (var zf = 0; zf < 8; zf++) rz.stepDiffusion(4, true);  // next=5，按播放节奏泵一次
  var peakBefore = absMaxField(rz.mapA);
  check('播放节奏下波场有界（满列 8 帧）', peakBefore > 0.01 && peakBefore < 100,
        'peak = ' + peakBefore.toFixed(3));

  var grown = 0;
  for (var zo = 0; zo < 180; zo++) {                        // 暂停 3 秒
    rz.stepDiffusion(4, false);
    grown = Math.max(grown, absMaxField(rz.mapA));
  }
  var peakAfter = absMaxField(rz.mapA);
  check('暂停时波场不再增长', grown <= peakBefore * 1.0001,
        grown.toFixed(4) + ' vs 初始 ' + peakBefore.toFixed(4));
  check('暂停时涟漪逐渐衰减消失', peakAfter < peakBefore * 0.02 && peakAfter < 0.1,
        peakBefore.toFixed(3) + ' → ' + peakAfter.toFixed(6));

  // 反向验证：持续注入确实会失控 —— 这条锁死「暂停必须停止注入」的原因
  var gb = new TM.Grid();
  var rb = new TM.Renderer(document.getElementById('tcanvas'), gb);
  for (var bc = 0; bc < 16; bc++) gb.set(5, bc, true);
  for (var bf = 0; bf < 900; bf++) rb.stepDiffusion(4, true);
  var blown = absMaxField(rb.mapA);
  check('持续注入会指数爆炸（故暂停必须停止注入）', blown > 1e6,
        'max|mapA| = ' + blown.toExponential(2));

  // ── 5.4 单次脉冲（右键试听用）──────────────────────────
  var gu = new TM.Grid();
  var ru = new TM.Renderer(document.getElementById('tcanvas'), gu);
  ru.setWaveEnabled(true);
  check('pulse 在指定格注入种子（mapB[行][列]）',
        ru.pulse(3, 7) === true && ru.mapB[7][3] === -1,
        'mapB[7][3] = ' + ru.mapB[7][3]);
  check('pulse 越界返回 false 且不注入',
        ru.pulse(-1, 0) === false && ru.pulse(16, 0) === false &&
        ru.pulse(0, 16) === false);
  check('pulse 不改动图案', gu.count() === 0, 'count = ' + gu.count());

  ru.stepDiffusion(0, false);                 // 推进一帧，种子应变成正能量
  check('pulse 的种子会产生涟漪', ru.mapA[7][3] > 0, 'mapA[7][3] = ' + ru.mapA[7][3]);

  ru.setWaveEnabled(false);
  check('涟漪关闭时 pulse 不注入', ru.pulse(2, 2) === false && ru.mapB[2][2] === 0);

  // ── 5.5 音序器时基（视觉靠时间轴反查，不是公式推算）──────
  function fakeAudio(latency) {
    return {
      ready: true,
      ctx: { currentTime: 0 },
      latency: latency || 0,
      tempo: 120,
      synthNote: function () {},
      setTempo: function (b) { this.tempo = b; },
      outputLatency: function () { return this.latency; }
    };
  }

  var fa = fakeAudio(0);
  var seq = new TM.Sequencer(fa, new TM.Grid());
  // 手动铺一条排程：0→10.000, 1→10.125, 2→10.250（120 BPM）
  seq._scheduleStep(0, 10.000);
  seq._scheduleStep(1, 10.125);
  seq._scheduleStep(2, 10.250);

  check('排程前返回 null', seq.stepAtTime(9.999) === null);
  check('步起点取该步', seq.stepAtTime(10.000) === 0, '给出 ' + seq.stepAtTime(10.000));
  check('步内返回当前步', seq.stepAtTime(10.120) === 0, '给出 ' + seq.stepAtTime(10.120));
  check('跨到下一步的瞬间切列', seq.stepAtTime(10.130) === 1, '给出 ' + seq.stepAtTime(10.130));
  check('末步之后保持末步', seq.stepAtTime(99) === 2, '给出 ' + seq.stepAtTime(99));

  // 改速度：后续步用新步长，已排的步不动 → 反查连续、不跳变
  seq._scheduleStep(3, 10.375);            // 仍按 120 BPM 排
  seq.setTempo(240);
  seq._scheduleStep(4, 10.4375);           // 240 BPM：步长 62.5 ms
  seq._scheduleStep(5, 10.5000);
  check('setTempo 传到音频引擎', fa.tempo === 240, '音频侧 tempo = ' + fa.tempo);
  check('变速后反查仍落在正确步', seq.stepAtTime(10.4374) === 3 &&
        seq.stepAtTime(10.4375) === 4 && seq.stepAtTime(10.4999) === 4 &&
        seq.stepAtTime(10.5000) === 5,
        [10.4374, 10.4375, 10.4999, 10.5000].map(function (t) {
          return seq.stepAtTime(t);
        }).join(','));

  // 顺序性：时间轴上的步号必须单调不回退
  var mono = true, last = -1, prevT = 10.0;
  for (var tt = 10.0; tt < 10.6; tt += 0.0005) {
    var s2 = seq.stepAtTime(tt);
    if (s2 !== null) { if (s2 !== last && (last + 1) % 16 !== s2 % 16) mono = false; last = s2; }
  }
  check('步号随时间严格递增不回退', mono, '末值 ' + last);

  // 延迟补偿：耳朵此刻听到的是 currentTime − outputLatency
  var fa2 = fakeAudio(0.1);
  var seq2 = new TM.Sequencer(fa2, new TM.Grid());
  seq2.playing = true;
  seq2._scheduleStep(0, 10.000);
  seq2._scheduleStep(1, 10.125);
  fa2.ctx.currentTime = 10.200;            // 写入头在 10.2
  check('audibleStep 减去输出延迟（听到 10.1 → 第 0 步）',
        seq2.audibleStep() === 0, '给出 ' + seq2.audibleStep());
  fa2.ctx.currentTime = 10.240;            // 听到 10.14 → 第 1 步
  check('延迟补偿跨步正确', seq2.audibleStep() === 1, '给出 ' + seq2.audibleStep());
  seq2.playing = false;
  check('停止时 audibleStep 返回 null', seq2.audibleStep() === null);

  // ── 5.6 延迟时长随速度变化 ─────────────────────────────
  var eng0 = new TM.AudioEngine();          // 纯数学，无需音频图
  check('延迟时长 @120BPM = 375 ms',
        near(eng0.delaySecondsFor(120), 0.375, 1e-12),
        (eng0.delaySecondsFor(120) * 1000).toFixed(1) + ' ms');
  check('延迟时长 @60BPM = 750 ms（3 步）',
        near(eng0.delaySecondsFor(60), 0.75, 1e-12),
        (eng0.delaySecondsFor(60) * 1000).toFixed(1) + ' ms');
  check('延迟时长 @180BPM = 250 ms（3 步）',
        near(eng0.delaySecondsFor(180), 0.25, 1e-12),
        (eng0.delaySecondsFor(180) * 1000).toFixed(1) + ' ms');
  check('任意速度下延迟恒为 3 步',
        [40, 90, 120, 155, 200, 240].every(function (b) {
          return near(eng0.delaySecondsFor(b) / TM.stepSeconds(b), 3, 1e-9);
        }));

  var spyEng = new TM.AudioEngine();
  spyEng.buildGraph(new OfflineAudioContext(2, 4410, 44100));
  var scheduled = [];
  var realSet = spyEng.delay.delayTime.setTargetAtTime;
  spyEng.delay.delayTime.setTargetAtTime = function (v, t, c) {
    scheduled.push(v); return realSet.call(this, v, t, c);
  };
  spyEng.setTempo(60);
  check('setTempo 会重排延迟时间', scheduled.length === 1,
        '调用 ' + scheduled.length + ' 次，目标 ' +
        (scheduled[0] !== undefined ? (scheduled[0] * 1000).toFixed(1) + ' ms' : '无'));
  check('重排目标 = 750 ms + 中心偏移',
        scheduled.length === 1 &&
        near(scheduled[0], 0.75 + (TM.CONFIG.DELAY_MOD_SAMPLES * 2) / 44100, 1e-9),
        scheduled.length ? scheduled[0].toFixed(6) : '—');

  // ── 6. 离线音频渲染 ────────────────────────────────────
  // 只渲染一次：60 BPM 下延迟 = 3 步 = 750 ms，回声与干声在时间上完全分开，
  // 便于同时验证波形/包络/声像与「延迟跟随速度」。
  var realRandom = Math.random;
  Math.random = function () { return 0.5; };     // r = 0 → gainL = gainR = 1

  var offline = new OfflineAudioContext(2, 44100 * 1.2, 44100);
  var eng = new TM.AudioEngine();
  eng.setTempo(60);                              // 必须在建图前设置：
  eng.buildGraph(offline);                       // 延迟初值直接取 750 ms，避免过渡期拖尾糊掉测量
  eng.setVolume(1);
  eng.synthNote(72, 0);                          // A4 = 440 Hz

  offline.startRendering().then(function (buf) {
    Math.random = realRandom;

    var L = buf.getChannelData(0);
    var R = buf.getChannelData(1);
    function peakBetween(a, b) {
      var p = 0, i0 = Math.floor(a * 44100), i1 = Math.min(L.length, Math.floor(b * 44100));
      for (var i = i0; i < i1; i++) p = Math.max(p, Math.abs(L[i]));
      return p;
    }

    // 峰值应等于包络峰值 0.16（软限幅在 0.7 以下为线性，不改变幅值）
    var peak = 0;
    for (var i2 = 0; i2 < L.length; i2++) peak = Math.max(peak, Math.abs(L[i2]));
    check('峰值 = 0.16（包络 env² 峰值）', near(peak, 0.16, 0.005), peak.toFixed(5));

    // 零交叉估算频率
    var crossings = 0, prev = L[44];               // 跳过最开头的几个采样
    var winEnd = Math.floor(44100 * 0.3);
    for (var j = 44; j < winEnd; j++) {
      var cur = L[j];
      if ((prev < 0 && cur >= 0) || (prev >= 0 && cur < 0)) crossings++;
      prev = cur;
    }
    var freq = crossings / 2 / 0.3;
    check('频率 ≈ 440 Hz（A4）', near(freq, 440, 8), freq.toFixed(1) + ' Hz');

    // 包络在 t = 0.25 s 处的幅值应为 0.16 · 0.5² = 0.04
    var s0 = Math.floor(44100 * 0.25), localPeak = 0;
    for (var m = s0; m < s0 + 300; m++) localPeak = Math.max(localPeak, Math.abs(L[m]));
    check('t=0.25s 幅值 ≈ 0.04（二次衰减）', near(localPeak, 0.04, 0.012),
          localPeak.toFixed(5));

    // 立体声：随机声像居中时 L、R 应一致
    var lrDiff = 0;
    for (var q = 0; q < 2000; q++) lrDiff = Math.max(lrDiff, Math.abs(L[q] - R[q]));
    check('r=0 时左右声道一致', lrDiff < 1e-6, lrDiff.toExponential(2));

    // 端到端：60 BPM 下延迟 = 3 步 × 250 ms = 750 ms
    // 干声在 0.5 s 收尾，若延迟仍写死 375 ms，0.52~0.70 区间就会有明显能量
    var quiet = peakBetween(0.52, 0.70);
    var echo = peakBetween(0.75, 0.80);
    check('60BPM：0.52–0.70 s 安静（延迟没有停在 375 ms）', quiet < 0.001,
          quiet.toFixed(6));
    check('60BPM：回声落在 750 ms（延迟跟随速度）', echo > 0.003 && echo < 0.02,
          echo.toFixed(6));
    check('峰值 0.16 与干声结束一致（延迟湿声仅 6%）',
          near(peak, 0.16, 0.005) && echo < peak * 0.2, 'echo/peak = ' +
          (echo / peak).toFixed(4));

    finish();
  }).catch(function (e) {
    Math.random = realRandom;
    check('离线渲染未抛异常', false, String(e && e.message || e));
    finish();
  });

  function finish() { report(); }
})();
</script>
