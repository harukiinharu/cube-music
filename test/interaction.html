<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>interaction</title></head>
<body>
<pre id="out">running…</pre>
<script>
/* 乐谱现在会自动存进 localStorage，而本测试要求「初始网格为空」。
   父页与 iframe 同为 file:// origin、共用同一份存储，所以在 iframe 开始加载**之前**
   先清干净 —— 这段必须放在 <iframe> 标签前面。 */
try { localStorage.removeItem('cubemusic.score.small'); } catch (e) { /* 存储不可用则忽略 */ }
</script>
<iframe id="app" src="../index.html?debug=1" width="880" height="1100" style="border:0"></iframe>
<script>
/*
 * Cube Music 页面级交互自检
 *
 * 断言全部建立在模型状态上（通过 index.html?debug=1 暴露的 __cubeMusicDebug），
 * 不去采样渲染后的像素 —— 无头环境里 rAF 与定时器的推进节奏不一致，
 * 像素采样必然不稳定。渲染管线单独用一次显式 composite() 验证。
 */
var lines = [], pass = 0, fail = 0, done = false;

function check(name, ok, detail) {
  (ok ? pass++ : fail++);
  lines.push((ok ? 'PASS  ' : 'FAIL  ') + name + (detail ? '   ' + detail : ''));
}
function info(name, detail) { lines.push('INFO  ' + name + '   ' + detail); }

function report() {
  if (done) return;
  done = true;
  lines.unshift('Cube Music 交互自检 —— ' + pass + ' 通过 / ' + fail + ' 失败');
  lines.unshift('');
  document.getElementById('out').textContent = lines.join('\n');
  document.title = 'DONE ' + pass + '/' + (pass + fail);
}

function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

async function waitFor(fn, timeoutMs, label) {
  var limit = timeoutMs || 2000, waited = 0;
  while (waited < limit) {
    try { if (fn()) return true; } catch (e) { /* 忽略 */ }
    await wait(40);
    waited += 40;
  }
  if (label) info('轮询超时', label);
  return false;
}

window.addEventListener('error', function (e) {
  lines.push('JS ERROR: ' + e.message); fail++; report();
});
window.addEventListener('unhandledrejection', function (e) {
  lines.push('PROMISE REJECT: ' + (e.reason && e.reason.message || e.reason));
  fail++; report();
});
setTimeout(function () { lines.push('WATCHDOG: 12s 未完成'); fail++; report(); }, 12000);

var frame = document.getElementById('app');

frame.addEventListener('load', function () {
  var win = frame.contentWindow, doc = frame.contentDocument;
  if (!doc) { check('能访问 iframe 文档', false, 'contentDocument 为空'); report(); return; }
  win.addEventListener('error', function (e) {
    lines.push('IFRAME ERROR: ' + e.message + ' @' + e.lineno);
  });
  run(win, doc).catch(function (e) {
    check('交互自检未抛异常', false, String(e && e.message || e));
    report();
  });
});

async function run(win, doc) {
  await waitFor(function () { return !!win.__cubeMusicDebug; }, 2000);

  var dbg = win.__cubeMusicDebug;
  check('debug 句柄可用（?debug=1）', !!dbg,
        dbg ? 'grid/audio/sequencer/renderer 均暴露' : '未注入');
  if (!dbg) { report(); return; }

  // ── 文案 ───────────────────────────────────────────────
  check('页面标题 = Cube Music', doc.title === 'Cube Music', '实际 ' + doc.title);
  var h1 = doc.querySelector('.head h1');
  check('主标题 = Cube Music', h1 && h1.textContent.trim() === 'Cube Music',
        h1 ? h1.textContent.trim() : '缺失');
  var sub = doc.querySelector('.head .sub');
  check('标注灵感来源 warma', sub && /warma/.test(sub.textContent),
        sub ? sub.textContent.trim() : '缺失');

  // ── 涟漪 / 播放列开关（同款 toggle 按钮）───────────────
  var wave = doc.getElementById('btn-wave');
  check('存在涟漪开关按钮', !!wave);
  check('涟漪初始为开', dbg.renderer.showWave === true &&
        wave.getAttribute('aria-pressed') === 'true', wave.textContent.trim());
  wave.click();
  check('涟漪点击后为关', dbg.renderer.showWave === false &&
        wave.getAttribute('aria-pressed') === 'false', wave.textContent.trim());
  wave.click();
  check('涟漪再点恢复为开', dbg.renderer.showWave === true &&
        wave.getAttribute('aria-pressed') === 'true', wave.textContent.trim());

  var head = doc.getElementById('btn-playhead');
  check('存在播放列开关且初始为开',
        !!head && head.getAttribute('aria-pressed') === 'true' &&
        dbg.renderer.showPlayhead === true);
  head.click();
  check('播放列可关闭', dbg.renderer.showPlayhead === false &&
        head.getAttribute('aria-pressed') === 'false');
  head.click();
  check('播放列可恢复', dbg.renderer.showPlayhead === true &&
        head.getAttribute('aria-pressed') === 'true');

  // ── 控件布局：操作行 / 参数行分开 ───────────────────────
  check('操作行含 5 个按钮（暂停/清空/涟漪/播放列/谱子）',
        doc.querySelectorAll('.ctl-actions .btn').length === 5,
        '实际 ' + doc.querySelectorAll('.ctl-actions .btn').length);
  check('参数行含 2 个标签（速度/音量）',
        doc.querySelectorAll('.ctl-fields .f-label').length === 2,
        '实际 ' + doc.querySelectorAll('.ctl-fields .f-label').length);
  var volOut = doc.getElementById('volume-out');
  check('音量显示百分比', volOut && /85/.test(volOut.textContent),
        volOut ? volOut.textContent.trim() : '缺失');
  var tempoOut = doc.getElementById('tempo-out');
  check('速度显示 BPM', tempoOut && /120/.test(tempoOut.textContent),
        tempoOut ? tempoOut.textContent.trim() : '缺失');
  check('旧的复选框已移除', !doc.getElementById('playhead'));

  // ── 启动遮罩：点它只解锁声音，**不自动播放** ────────────
  // 刷新后如果自己就放起来很吵，用户要的是「先看着谱子，想听了再按播放」。
  var play = doc.getElementById('btn-toggle');
  var overlay = doc.getElementById('overlay');

  check('存在启动遮罩且初始可见',
        !!overlay && !overlay.classList.contains('hidden'));
  check('遮罩文案说明了「只是启用声音」',
        /启用声音/.test(overlay.textContent), overlay.textContent.trim().slice(0, 16));
  check('未播放时按钮写着「播放」', play.textContent.trim() === '播放',
        play.textContent.trim());

  overlay.click();
  await waitFor(function () {
    return dbg.audio.ready && overlay.classList.contains('hidden');
  }, 3000, '等待遮罩解锁音频');
  await wait(200);
  check('点遮罩解锁了音频', dbg.audio.ready === true);
  check('点遮罩**不会**自动开始播放', dbg.sequencer.playing === false,
        'playing = ' + dbg.sequencer.playing);
  check('解锁后按钮仍是「播放」', play.textContent.trim() === '播放',
        play.textContent.trim());

  // 再点「播放」——这条路必须真的播起来（第一次点还要顺手解锁）
  play.click();
  // 注意：不能等 audio.ready —— 它在 buildGraph 里就置位了，
  // 早于 audio.start() 的 then 回调执行 sequencer.start()。
  var started = await waitFor(function () { return dbg.sequencer.playing; }, 3000,
                              '等待进入播放状态');
  info('音频就绪', dbg.audio.ready + '，播放中 = ' + dbg.sequencer.playing);
  check('启动后进入播放状态', started && dbg.sequencer.playing === true,
        'playing = ' + dbg.sequencer.playing);
  check('按钮文案与状态一致', play.textContent.trim() === '暂停',
        play.textContent.trim());

  // ── 空格 = 暂停 / 继续 ─────────────────────────────────
  function pressSpace() {
    win.dispatchEvent(new win.KeyboardEvent('keydown',
      { code: 'Space', key: ' ', bubbles: true }));
  }

  pressSpace();
  await waitFor(function () { return dbg.sequencer.playing === false; }, 800);
  check('空格：暂停', dbg.sequencer.playing === false,
        'playing = ' + dbg.sequencer.playing);
  check('暂停后按钮变为「播放」', play.textContent.trim() === '播放',
        play.textContent.trim());

  pressSpace();
  await waitFor(function () { return dbg.sequencer.playing === true; }, 800);
  check('空格：继续', dbg.sequencer.playing === true,
        'playing = ' + dbg.sequencer.playing);

  // 继续播放必须**接着走**，不能回到第 0 步 —— start() 里曾经写死
  // currentStep = 0，每按一次空格继续都从头重放。
  // 这里把步号摆到 9 再走一次 stop → start：写死归零的话首排步号会是 0。
  dbg.sequencer.stop();
  dbg.sequencer.currentStep = 9;
  dbg.sequencer.start();
  check('空格继续：接着第 9 步走（没有回到第 0 步）',
        dbg.sequencer.playing === true &&
        dbg.sequencer.timeline.length > 0 &&
        dbg.sequencer.timeline[0].step === 9,
        '首排步号 ' + (dbg.sequencer.timeline.length
          ? dbg.sequencer.timeline[0].step : '—'));

  // ── 播放位置标尺：鼠标点 / 拖控制游标 ──────────────────
  var rulerEl = doc.getElementById('ruler');
  var fillEl = doc.getElementById('ruler-fill');
  var cursorEl = doc.getElementById('ruler-cursor');

  // 注意：`canvas` 这个变量在本文件后面才赋值，这里自己取一次引用
  var canvasEl = doc.getElementById('matrix');

  check('存在播放位置标尺', !!rulerEl && !!fillEl && !!cursorEl);
  check('标尺宽度与棋盘一致（位置才能对应到列）',
        Math.abs(rulerEl.getBoundingClientRect().width -
                 canvasEl.getBoundingClientRect().width) < 1.5,
        Math.round(rulerEl.getBoundingClientRect().width) + ' vs 棋盘 ' +
        Math.round(canvasEl.getBoundingClientRect().width));

  function scrub(col, type, pointerId) {
    var r = rulerEl.getBoundingClientRect();
    rulerEl.dispatchEvent(new win.PointerEvent(type, {
      clientX: r.left + r.width * ((col + 0.5) / 16),
      clientY: r.top + r.height / 2,
      bubbles: true, cancelable: true, pointerId: pointerId || 21, isPrimary: true
    }));
  }

  dbg.sequencer.stop();
  scrub(11, 'pointerdown');
  check('暂停时点标尺也能把游标挪过去（第 11 列）',
        dbg.sequencer.currentStep === 11 && dbg.renderer.stepIndex === 11,
        'currentStep = ' + dbg.sequencer.currentStep +
        '，renderer.stepIndex = ' + dbg.renderer.stepIndex);
  check('标尺游标同步画到第 11 列',
        Math.abs(parseFloat(cursorEl.style.left) - 11 / 16 * 100) < 0.01,
        cursorEl.style.left);

  scrub(3, 'pointermove');                      // 按住不放继续拖 = 擦洗
  check('按住拖动能连续擦洗到第 3 列', dbg.sequencer.currentStep === 3,
        'currentStep = ' + dbg.sequencer.currentStep);
  scrub(3, 'pointerup');

  dbg.sequencer.start();
  scrub(5, 'pointerdown');
  // 播放中 seek 会立刻补排一步，然后 currentStep 前进到「下一个待排的步」——
  // 和 start() 的语义一致（它指向下一步，不是刚排的那一步）。
  check('播放中也能跳（跳转后立刻排的是第 5 步）',
        dbg.sequencer.timeline.length > 0 && dbg.sequencer.timeline[0].step === 5,
        '首排步号 ' + (dbg.sequencer.timeline.length
          ? dbg.sequencer.timeline[0].step : '—'));
  check('跳转后步号继续前进', dbg.sequencer.currentStep === 6,
        'currentStep = ' + dbg.sequencer.currentStep);
  scrub(5, 'pointerup');

  // ── 点按 / 空格 / 清空 对网格的影响 ────────────────────
  var canvas = doc.getElementById('matrix');
  var rect = canvas.getBoundingClientRect();

  function tap(pointerId) {
    canvas.dispatchEvent(new win.PointerEvent('pointerdown', {
      clientX: rect.left + rect.width / 32,
      clientY: rect.top + rect.height / 32,
      bubbles: true, pointerId: pointerId, isPrimary: true
    }));
  }

  check('初始网格为空', dbg.grid.count() === 0, 'count = ' + dbg.grid.count());

  tap(1);
  await waitFor(function () { return dbg.grid.get(0, 0) === true; }, 800);
  check('点按点亮 cell(0,0)', dbg.grid.get(0, 0) === true);
  check('只点亮一格', dbg.grid.count() === 1, 'count = ' + dbg.grid.count());

  pressSpace();
  await wait(250);
  check('空格不清空网格', dbg.grid.count() === 1, 'count = ' + dbg.grid.count());
  check('空格只切播放，不影响格子', dbg.grid.get(0, 0) === true);

  pressSpace();     // 恢复播放状态

  doc.getElementById('btn-clear').click();
  await waitFor(function () { return dbg.grid.count() === 0; }, 800);
  check('清空按钮仍然清空网格', dbg.grid.count() === 0, 'count = ' + dbg.grid.count());

  // ── 右键试听（只发声，不改动图案、不改格子外观）────────
  var played = [];
  var origSynth = dbg.audio.synthNote;
  dbg.audio.synthNote = function (note, when) {
    played.push(note);
    return origSynth.call(this, note, when);
  };

  function at(col, row) {
    return {
      clientX: rect.left + rect.width * ((col + 0.5) / 16),
      clientY: rect.top + rect.height * ((row + 0.5) / 16)
    };
  }

  /**
   * 模拟真实右键：浏览器会**先**派发 pointerdown(button=2)，
   * 再派发 contextmenu。只派发 contextmenu 是测不出问题的
   * （早期版本就是漏了这个才让右键把格子翻转了）。
   */
  function rightClick(col, row) {
    var p = at(col, row);
    canvas.dispatchEvent(new win.PointerEvent('pointerdown', {
      clientX: p.clientX, clientY: p.clientY,
      bubbles: true, cancelable: true, pointerId: 9, isPrimary: true, button: 2, buttons: 2
    }));
    canvas.dispatchEvent(new win.MouseEvent('contextmenu', {
      clientX: p.clientX, clientY: p.clientY, bubbles: true, cancelable: true
    }));
  }

  check('试听前网格为空', dbg.grid.count() === 0, 'count = ' + dbg.grid.count());

  rightClick(2, 5);
  check('右键在那一格套上描边（告诉用户按的是哪格）',
        dbg.renderer.highlights.length === 1 &&
        dbg.renderer.highlights[0].col === 2 && dbg.renderer.highlights[0].row === 5,
        dbg.renderer.highlights.length
          ? '(' + dbg.renderer.highlights[0].col + ',' + dbg.renderer.highlights[0].row + ')'
          : '无描边');

  var gotSound = await waitFor(function () { return played.length > 0; }, 1500,
                               '等待右键试听发声');
  check('右键触发发声', gotSound && played.length === 1, '调用 ' + played.length + ' 次');
  check('音高 = NOTES[行]（第 5 行 → 84）',
        played[0] === win.TM.CONFIG.NOTES[5],
        'note = ' + played[0] + '，期望 ' + win.TM.CONFIG.NOTES[5]);

  // 这两条是本轮的核心：右键绝不能改动图案
  await wait(200);
  check('右键不改动图案', dbg.grid.count() === 0, 'count = ' + dbg.grid.count());
  check('右键不翻转该格', dbg.grid.get(2, 5) === false,
        'cell(2,5) = ' + dbg.grid.get(2, 5));

  played.length = 0;
  rightClick(2, 11);
  await waitFor(function () { return played.length > 0; }, 1500);
  check('不同行试听不同音高（第 11 行 → 69）',
        played[0] === win.TM.CONFIG.NOTES[11],
        'note = ' + played[0] + '，期望 ' + win.TM.CONFIG.NOTES[11]);
  check('多次右键仍不改动图案', dbg.grid.count() === 0, 'count = ' + dbg.grid.count());

  // 左键仍然正常翻转（确认按键判断没有误伤左键）
  var p5 = at(4, 3);
  canvas.dispatchEvent(new win.PointerEvent('pointerdown', {
    clientX: p5.clientX, clientY: p5.clientY,
    bubbles: true, cancelable: true, pointerId: 10, isPrimary: true, button: 0, buttons: 1
  }));
  await waitFor(function () { return dbg.grid.get(4, 3) === true; }, 800);
  check('左键仍然正常点亮（按键判断没误伤）', dbg.grid.get(4, 3) === true,
        'cell(4,3) = ' + dbg.grid.get(4, 3));
  var p5b = at(4, 3);
  canvas.dispatchEvent(new win.PointerEvent('pointerdown', {
    clientX: p5b.clientX, clientY: p5b.clientY,
    bubbles: true, cancelable: true, pointerId: 11, isPrimary: true, button: 0, buttons: 1
  }));
  await waitFor(function () { return dbg.grid.get(4, 3) === false; }, 800);
  check('左键再点可关掉', dbg.grid.get(4, 3) === false);

  // 点到画布外不应发声
  played.length = 0;
  canvas.dispatchEvent(new win.MouseEvent('contextmenu', {
    clientX: rect.left - 20, clientY: rect.top - 20, bubbles: true, cancelable: true
  }));
  await wait(200);
  check('右键画布外不发声', played.length === 0, '调用 ' + played.length + ' 次');

  delete dbg.audio.synthNote;              // 还原，避免影响后续断言

  // ── 涟漪关闭时点按仍然可用 ─────────────────────────────
  wave.click();
  check('涟漪已关闭', dbg.renderer.showWave === false);
  tap(2);
  await waitFor(function () { return dbg.grid.get(0, 0) === true; }, 800);
  check('涟漪关闭时仍能正常点格子', dbg.grid.get(0, 0) === true);

  // ── 渲染管线（显式合成一帧，不依赖 rAF 节奏）───────────
  var ctx = canvas.getContext('2d');
  var D = canvas.width;
  dbg.renderer.showPlayhead = false;
  dbg.renderer.composite(0);
  var px = Math.round(0.5 * D / 16), py = Math.round(0.5 * D / 16);
  var lit = ctx.getImageData(px, py, 1, 1).data[0];
  check('合成后画面确实点亮（含渲染链路）', lit > 200, 'cell(0,0) 亮度 ' + lit);

  // ── 乐谱：自动保存 / 导出 / 载入 ───────────────────────
  var shareBtn = doc.getElementById('btn-share');
  var shareRow = doc.getElementById('share-row');
  var shareCode = doc.getElementById('share-code');
  var shareStatus = doc.getElementById('share-status');
  var btnLoad = doc.getElementById('btn-share-load');

  check('存在「谱子」按钮与分享面板',
        !!shareBtn && !!shareRow && !!shareCode && !!shareStatus);
  check('分享面板默认收起',
        shareRow.hidden === true && shareBtn.getAttribute('aria-expanded') === 'false');
  check('收起时面板不占位（display 真的被隐藏）',
        win.getComputedStyle(shareRow).display === 'none',
        win.getComputedStyle(shareRow).display);

  shareBtn.click();
  check('点「谱子」展开面板',
        shareRow.hidden === false && shareBtn.getAttribute('aria-expanded') === 'true');
  check('展开后自动填入当前乐谱的代码',
        /^CM2\./.test(shareCode.value), shareCode.value.slice(0, 18) + '…');
  check('填入的代码与当前谱子一致',
        shareCode.value === win.TM.Store.encode(dbg.grid));

  // ── 面板里的代码跟着谱子实时更新 ───────────────────────
  dbg.grid.clear();
  dbg.grid.set(1, 2, true);
  dbg.grid.set(5, 6, true);
  dbg.grid.set(15, 0, true);
  var codeA = win.TM.Store.encode(dbg.grid);

  dbg.grid.clear();                       // 谱子变了，面板里的代码应该立刻跟着变
  dbg.grid.set(9, 9, true);
  check('面板展开时，代码跟着谱子实时更新',
        shareCode.value === win.TM.Store.encode(dbg.grid) &&
        shareCode.value !== codeA,
        shareCode.value.slice(0, 16) + '…');

  // 但用户正在粘代码时不能冲掉它
  shareCode.value = codeA;
  dbg.grid.set(11, 11, true);             // 面板里已经是「别人的代码」了
  check('用户粘进面板的内容不会被改动冲掉',
        shareCode.value === codeA, shareCode.value.slice(0, 16) + '…');

  btnLoad.click();
  check('把粘进来的代码载入能还原',
        dbg.grid.count() === 3 && dbg.grid.get(1, 2) &&
        dbg.grid.get(5, 6) && dbg.grid.get(15, 0),
        'count = ' + dbg.grid.count());
  check('载入成功后给出状态提示', /已载入/.test(shareStatus.textContent),
        shareStatus.textContent);
  check('载入后面板里换成本面板的标准写法',
        shareCode.value === win.TM.Store.encode(dbg.grid));

  // 坏输入：必须报错，且**不能**把当前谱子改坏
  var keep = dbg.grid.count();
  shareCode.value = 'CM2.$$$';
  btnLoad.click();
  check('乱码代码给出失败提示', /载入失败/.test(shareStatus.textContent),
        shareStatus.textContent);
  check('载入失败时不改动当前谱子', dbg.grid.count() === keep,
        'count = ' + dbg.grid.count());

  // 另一套尺寸的谱子现在**能**载入（CM2 按音高走，不是按行号），
  // 只是会如实报告落位情况 —— 这正是「换面板后数据还能用」的体现
  var other = new win.TM.Grid({ cols: 8, rows: 8 });
  other.set(1, 1, true);                       // 8 行表里的行 1 → 音高 93
  shareCode.value = win.TM.Store.encode(other);
  btnLoad.click();
  check('别的尺寸的谱子能载入（旧格式会直接拒绝）',
        /已载入/.test(shareStatus.textContent), shareStatus.textContent);
  check('跨尺寸载入后按音高落在正确的行上',
        dbg.grid.count() === 1 && dbg.grid.get(1, win.TM.CONFIG.NOTES.indexOf(93)),
        'count = ' + dbg.grid.count() + '，音高 93 在第 ' +
        win.TM.CONFIG.NOTES.indexOf(93) + ' 行');

  // 自动保存：改动后防抖 300ms 落进 localStorage
  shareCode.value = codeA;
  btnLoad.click();
  await wait(600);
  var stored = null;
  try { stored = localStorage.getItem('cubemusic.score.small'); } catch (e) { /* 忽略 */ }
  check('改动后自动写进 localStorage',
        stored === win.TM.Store.encode(dbg.grid),
        stored ? stored.slice(0, 18) + '…' : '没读到');

  // 「复制」在没有可用 clipboard 的环境（file:// 无用户手势）要优雅降级：
  // 反馈必须**同步**出现，不能挂在可能永不 settle 的 writeText promise 上
  var threwCopy = false;
  try { doc.getElementById('btn-share-copy').click(); } catch (e) { threwCopy = true; }
  check('点「复制」不抛异常', threwCopy === false);
  check('点「复制」同步给出反馈（不依赖 clipboard promise）',
        /复制|选中/.test(shareStatus.textContent), shareStatus.textContent);
  check('点「复制」会选中整段代码（可手动 ⌘C）',
        shareCode.selectionStart === 0 &&
        shareCode.selectionEnd === shareCode.value.length,
        shareCode.selectionStart + '–' + shareCode.selectionEnd);

  shareBtn.click();
  check('再点「谱子」收起面板', shareRow.hidden === true);

  // ── 撤销 / 反撤销 ──────────────────────────────────────
  function pressKey(key, opts) {
    opts = opts || {};
    win.dispatchEvent(new win.KeyboardEvent('keydown', {
      key: key, code: opts.code || '', bubbles: true, cancelable: true,
      metaKey: !!opts.meta, shiftKey: !!opts.shift
    }));
  }
  var mtx = doc.getElementById('matrix');
  function ptAt(col, row) {
    var r = mtx.getBoundingClientRect();
    return { clientX: r.left + r.width * ((col + 0.5) / 16),
             clientY: r.top + r.height * ((row + 0.5) / 16) };
  }
  function tapAt(col, row, id) {
    var p = ptAt(col, row);
    mtx.dispatchEvent(new win.PointerEvent('pointerdown', {
      clientX: p.clientX, clientY: p.clientY,
      bubbles: true, cancelable: true, pointerId: id, isPrimary: true
    }));
  }
  function dragTo(col, row, id) {
    var p = ptAt(col, row);
    mtx.dispatchEvent(new win.PointerEvent('pointermove', {
      clientX: p.clientX, clientY: p.clientY,
      bubbles: true, cancelable: true, pointerId: id, isPrimary: true
    }));
  }
  function dropPointer(id) {
    mtx.dispatchEvent(new win.PointerEvent('pointerup', {
      clientX: 0, clientY: 0, bubbles: true, pointerId: id, isPrimary: true
    }));
  }

  // 先立一个非空的基准状态，好验证「撤销清空」确实把东西还回来了
  doc.getElementById('btn-clear').click();
  await waitFor(function () { return dbg.grid.count() === 0; }, 800);
  tapAt(6, 6, 41);
  await waitFor(function () { return dbg.grid.get(6, 6) === true; }, 800);
  dropPointer(41);
  var baseCount = dbg.grid.count();
  check('撤销测试的基准状态非空', baseCount === 1, 'count = ' + baseCount);

  doc.getElementById('btn-clear').click();
  await waitFor(function () { return dbg.grid.count() === 0; }, 800);
  tapAt(2, 2, 42);
  await waitFor(function () { return dbg.grid.get(2, 2) === true; }, 800);
  dropPointer(42);
  tapAt(3, 3, 43);
  await waitFor(function () { return dbg.grid.get(3, 3) === true; }, 800);
  dropPointer(43);
  check('准备：两格点亮', dbg.grid.count() === 2, 'count = ' + dbg.grid.count());

  pressKey('z', { meta: true });
  check('⌘Z 撤销上一步（只退掉后点的那格）',
        dbg.grid.count() === 1 && dbg.grid.get(2, 2) && !dbg.grid.get(3, 3),
        'count = ' + dbg.grid.count());

  pressKey('z', { meta: true, shift: true });
  check('⌘⇧Z 反撤销（两格都回来）', dbg.grid.count() === 2,
        'count = ' + dbg.grid.count());

  pressKey('z', { meta: true });          // 撤销 tap(3,3)
  pressKey('z', { meta: true });          // 撤销 tap(2,2)
  check('连续撤销能退到清空之后', dbg.grid.count() === 0, 'count = ' + dbg.grid.count());
  pressKey('z', { meta: true });          // 再退一步 = 撤销「清空」本身
  check('撤销也能还原「清空」', dbg.grid.count() === baseCount,
        dbg.grid.count() + ' vs 清空前 ' + baseCount);

  // 拖动涂一整条 = **一步**撤销（不是每格一步）
  var beforeDrag = dbg.grid.count();
  tapAt(0, 9, 51);
  for (var dc = 1; dc <= 7; dc++) dragTo(dc, 9, 51);
  dropPointer(51);
  check('一次拖动涂了 8 格', dbg.grid.count() - beforeDrag === 8,
        '涂了 ' + (dbg.grid.count() - beforeDrag) + ' 格');
  pressKey('z', { meta: true });
  check('一次拖动只占一步撤销（整条一起退）', dbg.grid.count() === beforeDrag,
        dbg.grid.count() + ' vs ' + beforeDrag);

  // 焦点在「谱子」输入框里时，⌘Z 要交给浏览器，别去撤销棋盘
  var keepCount = dbg.grid.count();
  shareCode.dispatchEvent(new win.KeyboardEvent('keydown', {
    key: 'z', metaKey: true, bubbles: true, cancelable: true
  }));
  check('焦点在输入框里时 ⌘Z 不撤销棋盘',
        dbg.grid.count() === keepCount, 'count = ' + dbg.grid.count());

  // ── 框选：Alt 拉框 / 整体搬动 / X 删除 / A 填充 ─────────
  function altDrag(c0, r0, c1, r1, id) {
    var a = ptAt(c0, r0), b = ptAt(c1, r1);
    mtx.dispatchEvent(new win.PointerEvent('pointerdown', {
      clientX: a.clientX, clientY: a.clientY, altKey: true,
      bubbles: true, cancelable: true, pointerId: id, isPrimary: true
    }));
    mtx.dispatchEvent(new win.PointerEvent('pointermove', {
      clientX: b.clientX, clientY: b.clientY, altKey: true,
      bubbles: true, cancelable: true, pointerId: id, isPrimary: true
    }));
    dropPointer(id);
  }
  function key(k) {
    win.dispatchEvent(new win.KeyboardEvent('keydown', {
      key: k, bubbles: true, cancelable: true
    }));
  }

  doc.getElementById('btn-clear').click();
  await waitFor(function () { return dbg.grid.count() === 0; }, 800);
  dbg.grid.set(2, 2, true); dbg.grid.set(3, 2, true);
  dbg.grid.set(2, 3, true); dbg.grid.set(3, 3, true);
  check('准备：一个 2×2 的块', dbg.grid.count() === 4, 'count = ' + dbg.grid.count());
  check('初始没有选区', dbg.renderer.selection === null);

  altDrag(1, 1, 4, 4, 61);
  var sel = dbg.renderer.selection;
  check('Alt + 左键拖动拉出选区', !!sel, sel ? JSON.stringify(sel) : '无选区');
  check('选区矩形含起止两端',
        sel && sel.col0 === 1 && sel.row0 === 1 && sel.col1 === 4 && sel.row1 === 4,
        sel ? JSON.stringify(sel) : '');

  altDrag(6, 6, 4, 4, 62);                 // 反向拖（右下 → 左上）
  sel = dbg.renderer.selection;
  check('反方向拖动会归一化',
        sel && sel.col0 === 4 && sel.row0 === 4 && sel.col1 === 6 && sel.row1 === 6,
        sel ? JSON.stringify(sel) : '');

  // 在选区内按住左键 → 整体搬走
  altDrag(1, 1, 4, 4, 63);
  var beforeMove = dbg.grid.count();
  var pd = ptAt(2, 2);                     // 按在选区内
  mtx.dispatchEvent(new win.PointerEvent('pointerdown', {
    clientX: pd.clientX, clientY: pd.clientY,
    bubbles: true, cancelable: true, pointerId: 64, isPrimary: true
  }));
  var pm = ptAt(3, 5);                     // 往右下挪（+1 列 +3 行）
  mtx.dispatchEvent(new win.PointerEvent('pointermove', {
    clientX: pm.clientX, clientY: pm.clientY,
    bubbles: true, cancelable: true, pointerId: 64, isPrimary: true
  }));
  dropPointer(64);
  check('整体搬动不改变音符个数', dbg.grid.count() === beforeMove,
        dbg.grid.count() + ' vs ' + beforeMove);
  check('块搬到了新位置、原位置已清空',
        dbg.grid.get(3, 5) && dbg.grid.get(4, 5) &&
        dbg.grid.get(3, 6) && dbg.grid.get(4, 6) &&
        !dbg.grid.get(2, 2) && !dbg.grid.get(2, 3),
        'count = ' + dbg.grid.count());
  check('选区跟着块一起过去',
        dbg.renderer.selection.col0 === 2 && dbg.renderer.selection.row0 === 4 &&
        dbg.renderer.selection.col1 === 5 && dbg.renderer.selection.row1 === 7,
        JSON.stringify(dbg.renderer.selection));
  pressKey('z', { meta: true });           // 整次搬动应该只占一步
  check('整次搬动只占一步撤销（块回到原处）',
        dbg.grid.get(2, 2) && dbg.grid.get(3, 3) && !dbg.grid.get(3, 5),
        'count = ' + dbg.grid.count());
  pressKey('z', { meta: true, shift: true });

  // X 删除选区内的音符（重新铺一个块，别依赖上面那串搬动之后的落点）
  doc.getElementById('btn-clear').click();
  await waitFor(function () { return dbg.grid.count() === 0; }, 800);
  dbg.grid.set(2, 2, true); dbg.grid.set(3, 2, true);
  dbg.grid.set(2, 3, true); dbg.grid.set(3, 3, true);
  altDrag(1, 1, 4, 4, 65);
  var beforeX = dbg.grid.count();
  check('准备：块确实落在选区内', beforeX === 4, 'count = ' + beforeX);
  key('x');
  check('X 删除选区内的音符', dbg.grid.count() === beforeX - 4,
        dbg.grid.count() + ' vs ' + beforeX);
  check('删除后选区还在（方便继续操作）', !!dbg.renderer.selection);
  pressKey('z', { meta: true });
  check('删除可以撤销', dbg.grid.count() === beforeX, 'count = ' + dbg.grid.count());

  // A 填满选区
  dbg.grid.clear();
  altDrag(5, 5, 7, 7, 66);
  key('a');
  check('A 填满选区（3×3 = 9 格）', dbg.grid.count() === 9, 'count = ' + dbg.grid.count());
  pressKey('z', { meta: true });
  check('填充可以撤销', dbg.grid.count() === 0, 'count = ' + dbg.grid.count());

  // 拖出棋盘要被夹住：整块还在，只是贴到边界
  dbg.grid.clear();
  dbg.grid.set(2, 2, true); dbg.grid.set(3, 2, true);
  dbg.grid.set(2, 3, true); dbg.grid.set(3, 3, true);
  altDrag(1, 1, 4, 4, 70);
  var countBeforeFar = dbg.grid.count();
  var pf0 = ptAt(2, 2);
  mtx.dispatchEvent(new win.PointerEvent('pointerdown', {
    clientX: pf0.clientX, clientY: pf0.clientY,
    bubbles: true, cancelable: true, pointerId: 71, isPrimary: true
  }));
  var pf1 = ptAt(15, 15);                  // 远远拖出右下角
  mtx.dispatchEvent(new win.PointerEvent('pointermove', {
    clientX: pf1.clientX, clientY: pf1.clientY,
    bubbles: true, cancelable: true, pointerId: 71, isPrimary: true
  }));
  dropPointer(71);
  check('拖出边界会被夹住，音符一个不少', dbg.grid.count() === countBeforeFar,
        dbg.grid.count() + ' vs ' + countBeforeFar);
  check('夹住后整块贴到右下角',
        dbg.grid.get(13, 13) && dbg.grid.get(14, 13) &&
        dbg.grid.get(13, 14) && dbg.grid.get(14, 14),
        'count = ' + dbg.grid.count());

  // Esc 取消选区
  key('Escape');
  check('Esc 取消选区', dbg.renderer.selection === null);

  // 点画布**外面**的留白也要取消选择（那些区域到不了 canvas 的 pointerdown）
  altDrag(2, 2, 4, 4, 72);
  check('准备：有选区', !!dbg.renderer.selection);
  doc.body.dispatchEvent(new win.PointerEvent('pointerdown', {
    clientX: 5, clientY: 5, bubbles: true, cancelable: true,
    pointerId: 73, isPrimary: true
  }));
  check('点画布外的页面留白会取消选择', dbg.renderer.selection === null,
        JSON.stringify(dbg.renderer.selection));

  // 但点控件不该取消（正在调速度 / 音量 / 按播放时选区应该留着）
  altDrag(2, 2, 4, 4, 74);
  doc.getElementById('btn-wave').dispatchEvent(new win.PointerEvent('pointerdown', {
    bubbles: true, cancelable: true, pointerId: 75, isPrimary: true
  }));
  check('点控件不会取消选择', !!dbg.renderer.selection,
        JSON.stringify(dbg.renderer.selection));

  // 点在选区外 → 取消选择 + 正常涂抹
  altDrag(2, 2, 4, 4, 67);
  check('重新拉出选区', !!dbg.renderer.selection);
  tapAt(10, 10, 68);
  dropPointer(68);
  check('点选区外会取消选择', dbg.renderer.selection === null);
  check('点选区外同时正常点亮那一格', dbg.grid.get(10, 10) === true);

  // 焦点在输入框里时，X / A 不能去动选区。
  // 注意：选区内**必须真的有音符**，否则删掉也不会变，这条断言就成了摆设。
  doc.getElementById('btn-clear').click();
  await waitFor(function () { return dbg.grid.count() === 0; }, 800);
  dbg.grid.set(1, 1, true);
  dbg.grid.set(2, 2, true);
  altDrag(1, 1, 3, 3, 69);
  var beforeKeys = dbg.grid.count();
  check('准备：选区内确实有音符', beforeKeys === 2 && !!dbg.renderer.selection,
        'count = ' + beforeKeys);
  shareCode.dispatchEvent(new win.KeyboardEvent('keydown', {
    key: 'x', bubbles: true, cancelable: true
  }));
  check('焦点在输入框时 X 不动选区',
        dbg.grid.count() === beforeKeys && !!dbg.renderer.selection,
        'count = ' + dbg.grid.count());

  report();
}
</script>
</body>
</html>
